<!DOCTYPE html>
<!--
    새 여행 추가 방법
    1. 이 파일을 trips/새여행id.html 로 복사합니다. (예: trips/jeju-2027.html)
    2. <title>, 헤더 문구, 일차 탭 개수, 각 일정 카드 내용을 여행에 맞게 수정합니다.
       (일차를 늘리거나 줄이려면 nav의 tab-btn 버튼과 tab-content div를 함께 추가/삭제하세요)
    3. "상세 정보" 탭의 info-card 블록들을 여행에 맞게 채우거나 삭제합니다.
    4. assets/trips-data.js 의 TRIPS 배열에 새 여행 정보를 추가합니다.
    5. <body data-trip-id="..."> 값을 3번에서 정한 여행 id와 동일하게 맞춥니다.
       (일정 카드의 note-slot data-item-id는 이 여행 안에서만 고유하면 됩니다. 예: day1-1, day1-2 ...)
-->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OOO 님의 OOO 여행</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .tab-content { display: none; animation: fadeIn 0.3s ease-in-out; }
        .tab-content.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .timeline-line::before {
            content: '';
            position: absolute;
            left: 20px;
            top: 24px;
            bottom: -24px;
            width: 2px;
            background-color: #e5e7eb;
            z-index: 0;
        }
        .timeline-item:last-child .timeline-line::before { display: none; }
        .map-btn {
            display: inline-flex;
            align-items: center;
            font-size: 0.7rem;
            color: #4f46e5;
            background-color: #e0e7ff;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        .map-btn:hover { background-color: #c7d2fe; }
        .map-btn i { margin-right: 3px; }
        .info-card {
            background: white;
            border-radius: 0.75rem;
            padding: 1.25rem;
            margin-bottom: 1rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            border: 1px solid #f1f5f9;
        }
        .info-card-header {
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
        }
        .info-card-header i { margin-right: 0.5rem; font-size: 1.1rem; }
        .data-row { display: flex; margin-bottom: 0.5rem; font-size: 0.875rem; }
        .data-label { width: 80px; color: #64748b; font-weight: 500; flex-shrink: 0; }
        .data-value { color: #334155; flex-grow: 1; }
    </style>
</head>
<body class="pb-20" data-trip-id="새여행id">

    <div id="access-gate" class="fixed inset-0 z-[100] bg-slate-800 flex items-center justify-center p-6">
        <div class="bg-white rounded-2xl p-6 max-w-xs w-full text-center shadow-xl">
            <i class="fa-solid fa-lock text-3xl text-slate-400 mb-3"></i>
            <h2 class="font-bold text-slate-800 mb-1">로그인이 필요합니다</h2>
            <p class="text-xs text-slate-500 mb-4">여행 계획을 보려면 구글 계정으로 로그인하세요</p>
            <button type="button" onclick="gateSignIn()" class="w-full py-2.5 rounded-lg border border-slate-200 text-slate-700 text-sm font-medium flex items-center justify-center gap-2">
                <i class="fa-brands fa-google text-rose-500"></i> Google 계정으로 로그인
            </button>
            <p id="access-gate-error" class="text-xs text-rose-500 mt-2 h-4"></p>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-slate-800 text-white p-5 sticky top-0 z-50 shadow-md">
        <div class="flex justify-between items-center mb-2">
            <a href="../index.html" class="text-slate-300 hover:text-white text-xs inline-flex items-center gap-1"><i class="fa-solid fa-arrow-left"></i> 여행 목록으로</a>
            <button type="button" onclick="toggleLogin()" class="text-slate-300 hover:text-white w-7 h-7 rounded-full flex items-center justify-center" title="로그인 필요">
                <i id="admin-login-icon" class="fa-solid fa-lock"></i>
            </button>
        </div>
        <div class="flex justify-between items-center mb-2">
            <h1 class="text-xl font-bold">OOO 님의 OOO 여행 ✈️</h1>
            <span class="text-xs bg-slate-700 px-2 py-1 rounded-full text-slate-200">N박 N일</span>
        </div>
        <p class="text-sm text-slate-300"><i class="fa-solid fa-location-dot mr-1"></i> 여행지</p>
        <p class="text-sm text-slate-300 mt-1"><i class="fa-regular fa-calendar mr-1"></i> YYYY.MM.DD(요일) - MM.DD(요일)</p>
    </header>

    <!-- Navigation Tabs -->
    <nav class="bg-white shadow-sm sticky top-[132px] z-40">
        <div class="flex overflow-x-auto hide-scrollbar text-sm font-medium text-slate-500 whitespace-nowrap px-2">
            <button onclick="switchTab('day1')" id="tab-day1" class="tab-btn active px-4 py-3 text-slate-900 border-b-2 border-slate-800 transition-colors">1일차</button>
            <button onclick="switchTab('day2')" id="tab-day2" class="tab-btn px-4 py-3 hover:text-slate-900 transition-colors">2일차</button>
            <button onclick="switchTab('info')" id="tab-info" class="tab-btn px-4 py-3 hover:text-slate-900 transition-colors">상세 정보</button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="p-4 max-w-lg mx-auto">

        <!-- Day 1 -->
        <div id="day1" class="tab-content active">
            <h2 class="text-lg font-bold text-slate-800 mb-4 ml-1">1일차 (MM/DD, 요일)</h2>

            <div class="timeline-item relative z-10 mb-6">
                <div class="timeline-line"></div>
                <div class="flex gap-3">
                    <div class="w-10 h-10 rounded-full bg-sky-500 text-white flex items-center justify-center shadow z-10 shrink-0">
                        <i class="fa-solid fa-plane-departure"></i>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex-1">
                        <span class="text-xs font-bold text-slate-500 mb-1 block">HH:MM ~ HH:MM</span>
                        <h3 class="font-bold text-slate-800 flex items-center flex-wrap gap-y-1">
                            일정 제목
                            <a href="https://www.google.com/maps/search/?api=1&query=" target="_blank" class="map-btn"><i class="fa-solid fa-map-location-dot"></i>위치</a>
                        </h3>
                        <p class="text-sm text-slate-600 mt-1">일정 설명</p>
                        <!-- 메모 기능: 카드마다 이 블록을 추가하세요. data-item-id는 이 여행 안에서 고유해야 합니다. -->
                        <div class="note-slot mt-2" data-item-id="day1-1" data-item-title="일정 제목">
                            <div class="note-display hidden text-xs bg-amber-50 text-amber-800 rounded-lg p-2 whitespace-pre-wrap break-words mb-1"></div>
                            <button type="button" class="note-btn text-xs text-amber-600 font-medium inline-flex items-center gap-1" onclick="openNoteModal(this)">
                                <i class="fa-regular fa-note-sticky"></i><span class="note-btn-label">메모</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="timeline-item relative z-10 mb-6">
                <div class="flex gap-3">
                    <div class="w-10 h-10 rounded-full bg-slate-700 text-white flex items-center justify-center shadow z-10 shrink-0">
                        <i class="fa-solid fa-bed"></i>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex-1">
                        <span class="text-xs font-bold text-slate-500 mb-1 block">HH:MM ~</span>
                        <h3 class="font-bold text-slate-800">숙소 체크인</h3>
                        <div class="note-slot mt-2" data-item-id="day1-2" data-item-title="숙소 체크인">
                            <div class="note-display hidden text-xs bg-amber-50 text-amber-800 rounded-lg p-2 whitespace-pre-wrap break-words mb-1"></div>
                            <button type="button" class="note-btn text-xs text-amber-600 font-medium inline-flex items-center gap-1" onclick="openNoteModal(this)">
                                <i class="fa-regular fa-note-sticky"></i><span class="note-btn-label">메모</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Day 2 -->
        <div id="day2" class="tab-content">
            <h2 class="text-lg font-bold text-slate-800 mb-4 ml-1">2일차 (MM/DD, 요일)</h2>

            <div class="timeline-item relative z-10 mb-6">
                <div class="flex gap-3">
                    <div class="w-10 h-10 rounded-full bg-sky-500 text-white flex items-center justify-center shadow z-10 shrink-0">
                        <i class="fa-solid fa-plane-arrival"></i>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex-1">
                        <span class="text-xs font-bold text-slate-500 mb-1 block">HH:MM ~ HH:MM</span>
                        <h3 class="font-bold text-slate-800">귀국</h3>
                        <div class="note-slot mt-2" data-item-id="day2-1" data-item-title="귀국">
                            <div class="note-display hidden text-xs bg-amber-50 text-amber-800 rounded-lg p-2 whitespace-pre-wrap break-words mb-1"></div>
                            <button type="button" class="note-btn text-xs text-amber-600 font-medium inline-flex items-center gap-1" onclick="openNoteModal(this)">
                                <i class="fa-regular fa-note-sticky"></i><span class="note-btn-label">메모</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Info -->
        <div id="info" class="tab-content">
            <h2 class="text-lg font-bold text-slate-800 mb-4 ml-1">여행 상세 정보</h2>

            <div class="info-card">
                <div class="info-card-header text-sky-600">
                    <i class="fa-solid fa-plane"></i> 항공편 정보
                </div>
                <div class="data-row"><div class="data-label">편명</div><div class="data-value">내용</div></div>
                <div class="data-row"><div class="data-label">좌석</div><div class="data-value">내용</div></div>
            </div>

            <div class="info-card">
                <div class="info-card-header text-indigo-500">
                    <i class="fa-solid fa-hotel"></i> 숙소 정보
                </div>
                <div class="data-row"><div class="data-label">이용시간</div><div class="data-value">IN / OUT</div></div>
                <div class="data-row"><div class="data-label">연락처</div><div class="data-value">내용</div></div>
            </div>

        </div>

    </main>

    <!-- Note Modal (메모 기능: 모든 여행 페이지에 그대로 유지하세요) -->
    <div id="note-modal" class="fixed inset-0 z-[60] hidden">
        <div class="absolute inset-0 bg-black/40" onclick="closeNoteModal()"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-2xl p-4 max-w-lg mx-auto">
            <h3 id="note-modal-title" class="font-bold text-slate-800 mb-2">메모</h3>
            <textarea id="note-modal-textarea" class="w-full border border-slate-200 rounded-lg p-2 text-sm h-28 focus:outline-none focus:ring-2 focus:ring-amber-300" placeholder="메모를 입력하세요 (URL 링크도 남길 수 있어요)"></textarea>
            <div id="note-modal-status" class="text-xs text-slate-400 mt-1 h-4"></div>
            <div class="flex gap-2 mt-3 pb-2">
                <button type="button" onclick="closeNoteModal()" class="flex-1 py-2 rounded-lg bg-slate-100 text-slate-600 text-sm font-medium">닫기</button>
                <button type="button" id="note-modal-save" onclick="saveNote()" class="flex-1 py-2 rounded-lg bg-slate-800 text-white text-sm font-medium">저장</button>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('active', 'text-slate-900', 'border-b-2', 'border-slate-800');
                el.classList.add('text-slate-500');
            });
            document.getElementById(tabId).classList.add('active');
            const activeBtn = document.getElementById('tab-' + tabId);
            activeBtn.classList.remove('text-slate-500');
            activeBtn.classList.add('active', 'text-slate-900', 'border-b-2', 'border-slate-800');
        }
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="../assets/firebase-config.js"></script>
    <script src="../assets/auth.js"></script>
    <script src="../assets/notes.js"></script>
</body>
</html>
