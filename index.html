<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>상후 님의 여행 기록</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="pb-20">

    <div id="access-gate" class="fixed inset-0 z-[100] bg-slate-800 flex items-center justify-center p-6">
        <div class="bg-white rounded-2xl p-6 max-w-xs w-full text-center shadow-xl">
            <i class="fa-solid fa-lock text-3xl text-slate-400 mb-3"></i>
            <h2 class="font-bold text-slate-800 mb-1">비밀번호 확인</h2>
            <p class="text-xs text-slate-500 mb-4">여행 계획을 보려면 비밀번호를 입력하세요</p>
            <input id="access-gate-input" type="password" inputmode="numeric" maxlength="8" class="w-full border border-slate-200 rounded-lg p-2 text-center text-lg tracking-widest mb-2" placeholder="••••" autocomplete="off">
            <p id="access-gate-error" class="text-xs text-rose-500 mb-2 h-4"></p>
            <button id="access-gate-submit" type="button" class="w-full py-2 rounded-lg bg-slate-800 text-white text-sm font-medium">확인</button>
        </div>
    </div>
    <script src="assets/access-gate.js"></script>

    <header class="bg-slate-800 text-white p-5 sticky top-0 z-50 shadow-md">
        <h1 class="text-xl font-bold">상후 님의 여행 기록 ✈️</h1>
        <p class="text-sm text-slate-300 mt-1">다녀온, 그리고 앞으로 떠날 여행들</p>
    </header>

    <nav class="bg-white shadow-sm sticky top-[84px] z-40">
        <div class="flex gap-2 overflow-x-auto hide-scrollbar px-4 py-3 max-w-lg mx-auto">
            <button data-filter="all" onclick="switchFilter('all')" class="filter-btn bg-slate-800 text-white text-sm font-medium px-3 py-1.5 rounded-full transition-colors">전체</button>
            <button data-filter="upcoming" onclick="switchFilter('upcoming')" class="filter-btn bg-white text-slate-600 text-sm font-medium px-3 py-1.5 rounded-full border border-slate-200 transition-colors">예정</button>
            <button data-filter="ongoing" onclick="switchFilter('ongoing')" class="filter-btn bg-white text-slate-600 text-sm font-medium px-3 py-1.5 rounded-full border border-slate-200 transition-colors">진행중</button>
            <button data-filter="past" onclick="switchFilter('past')" class="filter-btn bg-white text-slate-600 text-sm font-medium px-3 py-1.5 rounded-full border border-slate-200 transition-colors">완료</button>
        </div>
    </nav>

    <main class="p-4 max-w-lg mx-auto">
        <div id="trip-list" class="space-y-4"></div>
        <div id="empty-state" class="hidden text-center text-slate-400 text-sm py-16">
            <i class="fa-solid fa-suitcase-rolling text-3xl mb-3"></i>
            <p>해당하는 여행이 없어요.</p>
        </div>
    </main>

    <script src="assets/trips-data.js"></script>
    <script src="assets/site.js"></script>
</body>
</html>
