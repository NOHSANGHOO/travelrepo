<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teo's space</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        window.tailwind = window.tailwind || {};
        tailwind.config = { theme: { extend: { colors: { teal: {
            50: '#f2f7f4', 100: '#dfeae3', 200: '#c2d8ca', 300: '#98bda8', 400: '#6ba088',
            500: '#4d8a70', 600: '#3f735d', 700: '#355d4b', 800: '#2d4b3d', 900: '#273e33'
        } } } } };
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f6f1e9; -webkit-tap-highlight-color: transparent; }
        button:not(:disabled), a { transition: transform 0.1s ease, background-color 0.15s ease, box-shadow 0.15s ease; }
        button:not(:disabled):active { transform: scale(0.96); }
        .cat-card:active { transform: scale(0.98); }
    </style>
</head>
<body class="pb-20">

    <div id="access-gate" style="display:none;" class="fixed inset-0 z-[100] bg-stone-900 flex items-center justify-center p-6">
        <div class="bg-white rounded-2xl p-6 max-w-xs w-full text-center shadow-xl">
            <i class="fa-solid fa-lock text-3xl text-stone-400 mb-3"></i>
            <h2 class="font-bold text-stone-800 mb-1">로그인이 필요합니다</h2>
            <p class="text-xs text-stone-500 mb-4">Teo's space를 보려면 구글 계정으로 로그인하세요</p>
            <button type="button" onclick="gateSignIn()" class="w-full py-2.5 rounded-lg border border-stone-200 text-stone-700 text-sm font-medium flex items-center justify-center gap-2">
                <i class="fa-brands fa-google text-rose-500"></i> Google 계정으로 로그인
            </button>
            <p id="access-gate-error" class="text-xs text-rose-500 mt-2 h-4"></p>
        </div>
    </div>

    <header class="bg-stone-900 text-white p-5 sticky top-0 z-50 shadow-md">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black tracking-tight">Teo's space</h1>
                <p class="text-sm text-stone-300 mt-1">여행, 요리, 그리고 이것저것</p>
            </div>
            <div class="relative">
                <button id="profile-btn" type="button" onclick="onProfileClick(event)" class="text-stone-300 hover:text-white w-8 h-8 rounded-full flex items-center justify-center hover:bg-white/10" title="로그인">
                    <i id="admin-login-icon" class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
                <div id="profile-popover" class="hidden absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-xl border border-stone-100 p-3 text-left z-[80]">
                    <p class="text-[11px] text-stone-400 mb-0.5">로그인 계정</p>
                    <p id="profile-email" class="text-sm font-medium text-stone-800 break-all"></p>
                    <p id="profile-role" class="text-xs text-teal-600 font-medium mb-3"></p>
                    <button type="button" onclick="doSignOut()" class="w-full py-2 rounded-lg bg-stone-100 hover:bg-stone-200 text-stone-600 text-sm font-medium">로그아웃</button>
                </div>
            </div>
        </div>
    </header>

    <main class="p-4 max-w-lg mx-auto space-y-4">
        <a href="trips.html" class="cat-card block bg-white rounded-2xl shadow-sm border border-stone-100 overflow-hidden hover:shadow-md">
            <div class="h-28 bg-gradient-to-br from-teal-500 to-sky-500 flex items-center justify-center">
                <i class="fa-solid fa-plane-departure text-white text-4xl opacity-95"></i>
            </div>
            <div class="p-4">
                <h2 class="font-bold text-stone-800 text-lg">여행계획</h2>
                <p class="text-sm text-stone-500 mt-0.5">다녀온, 그리고 앞으로 떠날 여행들</p>
            </div>
        </a>

        <a href="docs.html?type=recipe" class="cat-card block bg-white rounded-2xl shadow-sm border border-stone-100 overflow-hidden hover:shadow-md">
            <div class="h-28 bg-gradient-to-br from-orange-400 to-rose-400 flex items-center justify-center">
                <i class="fa-solid fa-utensils text-white text-4xl opacity-95"></i>
            </div>
            <div class="p-4">
                <h2 class="font-bold text-stone-800 text-lg">레시피</h2>
                <p class="text-sm text-stone-500 mt-0.5">마크다운으로 정리하는 나만의 요리 레시피</p>
            </div>
        </a>

        <a href="docs.html?type=misc" class="cat-card block bg-white rounded-2xl shadow-sm border border-stone-100 overflow-hidden hover:shadow-md">
            <div class="h-28 bg-gradient-to-br from-amber-400 to-teal-500 flex items-center justify-center">
                <i class="fa-solid fa-note-sticky text-white text-4xl opacity-95"></i>
            </div>
            <div class="p-4">
                <h2 class="font-bold text-stone-800 text-lg">기타</h2>
                <p class="text-sm text-stone-500 mt-0.5">이것저것 적어두는 마크다운 메모장</p>
            </div>
        </a>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
    <script src="assets/firebase-config.js"></script>
    <script src="assets/auth.js"></script>
</body>
</html>
