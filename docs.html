<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teo's space</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        window.tailwind = window.tailwind || {};
        tailwind.config = { theme: { extend: { colors: { teal: {
            50: '#f2f7f4', 100: '#dfeae3', 200: '#c2d8ca', 300: '#98bda8', 400: '#6ba088',
            500: '#4d8a70', 600: '#3f735d', 700: '#355d4b', 800: '#2d4b3d', 900: '#273e33'
        } } } } };
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f6f1e9; -webkit-tap-highlight-color: transparent; }
        button:not(:disabled), a { transition: transform 0.1s ease, background-color 0.15s ease, box-shadow 0.15s ease; }
        button:not(:disabled):active { transform: scale(0.96); }
        /* Markdown typography (Tailwind preflight resets these, so restore) */
        .md-body { color: #44403c; line-height: 1.75; font-size: 0.95rem; word-break: break-word; }
        .md-body h1 { font-size: 1.5rem; font-weight: 800; color: #292524; margin: 1rem 0 0.6rem; }
        .md-body h2 { font-size: 1.25rem; font-weight: 700; color: #292524; margin: 1rem 0 0.5rem; padding-bottom: 0.25rem; border-bottom: 1px solid #efe9df; }
        .md-body h3 { font-size: 1.05rem; font-weight: 700; color: #44403c; margin: 0.8rem 0 0.4rem; }
        .md-body p { margin: 0.5rem 0; }
        .md-body ul { list-style: disc; padding-left: 1.4rem; margin: 0.5rem 0; }
        .md-body ol { list-style: decimal; padding-left: 1.4rem; margin: 0.5rem 0; }
        .md-body li { margin: 0.2rem 0; }
        .md-body a { color: #3f735d; text-decoration: underline; word-break: break-all; }
        .md-body strong { font-weight: 700; color: #292524; }
        .md-body code { background: #f0ebe2; padding: 0.1rem 0.3rem; border-radius: 4px; font-size: 0.85em; }
        .md-body pre { background: #2d2a26; color: #f5f0e8; padding: 0.8rem; border-radius: 0.6rem; overflow-x: auto; margin: 0.6rem 0; }
        .md-body pre code { background: transparent; color: inherit; padding: 0; }
        .md-body blockquote { border-left: 3px solid #c2d8ca; padding: 0.2rem 0.8rem; color: #6b7280; margin: 0.6rem 0; background: #f6f8f5; border-radius: 0 0.4rem 0.4rem 0; }
        .md-body table { border-collapse: collapse; width: 100%; margin: 0.6rem 0; font-size: 0.85rem; }
        .md-body th, .md-body td { border: 1px solid #e7e2d8; padding: 0.4rem 0.6rem; text-align: left; }
        .md-body th { background: #f0ebe2; }
        .md-body img { max-width: 100%; border-radius: 0.6rem; }
        .md-body hr { border: none; border-top: 1px solid #e7e2d8; margin: 1rem 0; }
        /* Recipe categories: horizontal tab bar */
        .cat-tabbar { display: flex; gap: 0.3rem; overflow-x: auto; padding: 0.15rem 0.15rem 0.7rem;
            -ms-overflow-style: none; scrollbar-width: none; }
        .cat-tabbar::-webkit-scrollbar { display: none; }
        .cat-tab { flex: 1 1 0; min-width: max-content; display: inline-flex; align-items: center; justify-content: center;
            gap: 0.3rem; white-space: nowrap; padding: 0.45rem 0.6rem; border-radius: 9999px;
            background: #fff; border: 1px solid #e7e0d5; color: #78716c; font-size: 0.8125rem; font-weight: 600;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease; }
        .cat-tab:hover { border-color: #d3c9b9; }
        .cat-tab:active { transform: scale(0.96); }
        .cat-tab.active { background: var(--cat, #7d8a7a); border-color: var(--cat, #7d8a7a); color: #fff;
            box-shadow: 0 3px 10px color-mix(in srgb, var(--cat, #7d8a7a) 35%, transparent); }
        .cat-tab-count { font-size: 0.7rem; font-weight: 700; padding: 0 0.35rem; min-width: 1.15rem; height: 1.15rem;
            border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center;
            background: #f0ebe2; color: #8a8177; }
        .cat-tab.active .cat-tab-count { background: rgba(255,255,255,0.28); color: #fff; }
        .cat-tab.drop-hover { border-style: dashed; border-color: #4d8a70; background: #eef5f0; color: #355d4b; transform: scale(1.06); }
        /* 검색 결과 카드에 붙는 카테고리 칩 */
        .cat-chip { display: inline-block; margin-top: 0.3rem; font-size: 0.68rem; font-weight: 700; padding: 0.1rem 0.45rem;
            border-radius: 9999px; color: var(--cat, #7d8a7a); background: color-mix(in srgb, var(--cat, #7d8a7a) 13%, #fff);
            border: 1px solid color-mix(in srgb, var(--cat, #7d8a7a) 28%, #fff); }
        /* 탭 전환 시 목록이 살짝 올라오며 나타남 */
        #doc-list.cat-anim > .doc-card { animation: catFade 0.3s cubic-bezier(0.22,1,0.36,1) both; }
        #doc-list.cat-anim > .doc-card:nth-child(1) { animation-delay: 0ms; }
        #doc-list.cat-anim > .doc-card:nth-child(2) { animation-delay: 30ms; }
        #doc-list.cat-anim > .doc-card:nth-child(3) { animation-delay: 60ms; }
        #doc-list.cat-anim > .doc-card:nth-child(4) { animation-delay: 90ms; }
        #doc-list.cat-anim > .doc-card:nth-child(n+5) { animation-delay: 120ms; }
        @keyframes catFade { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
        .doc-card { transition: box-shadow 0.2s ease, transform 0.14s cubic-bezier(0.22,1,0.36,1), opacity 0.2s ease, border-color 0.18s ease; }
        .doc-card-ghost { opacity: 0.4; transform: scale(0.98); }
        .doc-grip { touch-action: none; -webkit-tap-highlight-color: transparent; }
        .doc-drag-clone { position: fixed; z-index: 120; pointer-events: none; margin: 0 !important;
            box-shadow: 0 16px 34px rgba(80,60,40,0.24); transform: scale(1.03) rotate(-0.5deg);
            border-color: #c2d8ca !important; }
        body.doc-dragging-active { cursor: grabbing; user-select: none; -webkit-user-select: none; }
        body.doc-dragging-active * { cursor: grabbing !important; }
        /* 편집기 하단 고정 액션바 (긴 레시피에서도 저장/취소가 항상 보이도록) */
        #doc-editor-view { padding-bottom: 4.75rem; }
        .doc-editor-bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; z-index: 60;
            width: 100%; max-width: 32rem; display: flex; gap: 0.5rem;
            padding: 0.7rem 1rem calc(0.7rem + env(safe-area-inset-bottom, 0px));
            background: rgba(255,255,255,0.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-top: 1px solid #ece5da; box-shadow: 0 -4px 16px rgba(80,60,40,0.07); }
        /* Editor placeholders (골격 예시는 실제 입력값이 아닌 회색 안내 문구) */
        #doc-editor-title::placeholder, #doc-editor-body::placeholder { color: #b6ada0; }
        #doc-editor-body::placeholder { line-height: 1.7; }
        /* Star ratings */
        .rt-stars { position: relative; display: inline-block; line-height: 1; white-space: nowrap; }
        .rt-stars .rt-base { color: #e2ddd4; letter-spacing: 1px; }
        .rt-stars .rt-fill { position: absolute; left: 0; top: 0; overflow: hidden; color: #f0b429; letter-spacing: 1px; transition: width 0.22s cubic-bezier(0.22,1,0.36,1); }
        /* min-height keeps the half-star hit zones clickable even if the icon font fails to load */
        .rt-picker { position: relative; display: inline-block; min-height: 1.5rem; }
        .rt-picker .rt-zones { position: absolute; inset: 0; }
        .rt-picker .rt-zone { position: absolute; top: 0; bottom: 0; width: 10%; background: transparent; border: 0; padding: 0; cursor: pointer; }
        .rt-picker:hover .rt-fill { color: #e8a317; }
        .rt-picker .rt-stars { transition: transform 0.14s cubic-bezier(0.22,1,0.36,1); }
        .rt-picker:hover .rt-stars { transform: scale(1.06); }
    </style>
</head>
<body class="pb-20">

    <div id="access-gate" style="display:none;" class="fixed inset-0 z-[100] bg-stone-900 flex items-center justify-center p-6">
        <div class="bg-white rounded-2xl p-6 max-w-xs w-full text-center shadow-xl">
            <i class="fa-solid fa-lock text-3xl text-stone-400 mb-3"></i>
            <h2 class="font-bold text-stone-800 mb-1">로그인이 필요합니다</h2>
            <p class="text-xs text-stone-500 mb-4">Teo's space를 보려면 구글 계정으로 로그인하세요</p>
            <button type="button" onclick="gateSignIn()" class="w-full py-2.5 rounded-lg border border-stone-200 text-stone-700 text-sm font-medium flex items-center justify-center gap-2">
                <i class="fa-brands fa-google text-rose-500"></i> Google 계정으로 로그인
            </button>
            <p id="access-gate-error" class="text-xs text-rose-500 mt-2 h-4"></p>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-stone-900 text-white p-5 sticky top-0 z-50 shadow-md">
        <div class="flex justify-between items-center mb-2">
            <a href="index.html" class="text-stone-300 hover:text-white text-xs inline-flex items-center gap-1"><i class="fa-solid fa-arrow-left"></i> Teo's space</a>
            <div class="relative">
                <button id="profile-btn" type="button" onclick="onProfileClick(event)" class="text-stone-300 hover:text-white w-8 h-8 rounded-full flex items-center justify-center hover:bg-white/10" title="로그인"><i id="admin-login-icon" class="fa-solid fa-arrow-right-to-bracket"></i></button>
                <div id="profile-popover" class="hidden absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-xl border border-stone-100 p-3 text-left z-[80]">
                    <p class="text-[11px] text-stone-400 mb-0.5">로그인 계정</p>
                    <p id="profile-email" class="text-sm font-medium text-stone-800 break-all"></p>
                    <p id="profile-role" class="text-xs text-teal-600 font-medium mb-3"></p>
                    <button type="button" onclick="doSignOut()" class="w-full py-2 rounded-lg bg-stone-100 hover:bg-stone-200 text-stone-600 text-sm font-medium">로그아웃</button>
                </div>
            </div>
        </div>
        <h1 id="doc-page-title" class="text-xl font-bold"></h1>
    </header>

    <main class="p-4 max-w-lg mx-auto">
        <!-- List view -->
        <div id="doc-list-view">
            <div id="cat-tabs"></div>
            <div class="relative mb-3">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-stone-400 text-sm"></i>
                <input id="doc-search" type="text" oninput="filterDocs(this.value)" class="w-full pl-9 pr-3 py-2.5 rounded-xl border border-stone-200 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-teal-300" placeholder="제목 검색">
            </div>
            <button type="button" id="doc-add-btn" onclick="openDocEditor()" class="hidden w-full mb-3 py-3 rounded-2xl border border-dashed border-teal-300 text-teal-700 text-sm font-semibold flex items-center justify-center gap-2 transition active:scale-95 hover:bg-teal-50">
                <i class="fa-solid fa-plus"></i> 새 항목
            </button>
            <div id="doc-list" class="space-y-3"></div>
            <p id="doc-empty" class="hidden text-center text-stone-400 text-sm py-16"></p>
        </div>

        <!-- Detail view -->
        <div id="doc-detail-view" class="hidden">
            <button type="button" onclick="showDocList()" class="text-stone-500 hover:text-stone-800 text-sm inline-flex items-center gap-1 mb-3"><i class="fa-solid fa-arrow-left"></i> 목록</button>
            <div class="bg-white rounded-2xl shadow-sm border border-stone-100 p-5">
                <div class="flex justify-between items-start gap-2 mb-1">
                    <h2 id="doc-detail-title" class="text-xl font-bold text-stone-800"></h2>
                    <div class="flex gap-3 shrink-0 pt-1 items-center">
                        <button type="button" onclick="shareCurrentDoc(event)" class="text-stone-400 hover:text-teal-600" title="공유 링크 복사"><i class="fa-solid fa-share-nodes text-sm"></i></button>
                        <div id="doc-detail-admin" class="hidden flex gap-3">
                            <button type="button" onclick="openDocEditor(currentDocId())" class="text-stone-400 hover:text-stone-700"><i class="fa-solid fa-pen text-sm"></i></button>
                            <button type="button" onclick="deleteDoc()" class="text-stone-400 hover:text-rose-600"><i class="fa-solid fa-trash text-sm"></i></button>
                        </div>
                    </div>
                </div>
                <p id="doc-detail-meta" class="text-[11px] text-stone-400 mb-4"></p>
                <div id="doc-detail-body" class="md-body"></div>
            </div>
            <div id="ratings-root" class="mt-4"></div>
            <div id="comments-root" class="mt-3"></div>
        </div>

        <!-- Editor view -->
        <div id="doc-editor-view" class="hidden">
            <button type="button" onclick="showDocList()" class="text-stone-500 hover:text-stone-800 text-sm inline-flex items-center gap-1 mb-3"><i class="fa-solid fa-xmark"></i> 취소</button>
            <h2 id="doc-editor-heading" class="text-lg font-bold text-stone-800 mb-3"></h2>
            <label class="text-xs text-stone-500 font-medium">제목</label>
            <input id="doc-editor-title" type="text" class="w-full border border-stone-200 rounded-lg p-2.5 text-sm mb-3 bg-white" placeholder="제목">
            <div id="doc-editor-cat-wrap" class="hidden mb-3">
                <label class="text-xs text-stone-500 font-medium">카테고리</label>
                <select id="doc-editor-cat" class="w-full border border-stone-200 rounded-lg p-2.5 text-sm bg-white"></select>
            </div>
            <div class="flex items-center justify-between mb-1">
                <label class="text-xs text-stone-500 font-medium">내용 (마크다운)</label>
                <button type="button" onclick="toggleDocPreview()" class="text-xs text-teal-700 font-medium"><i class="fa-solid fa-eye mr-1"></i>미리보기</button>
            </div>
            <textarea id="doc-editor-body" class="w-full border border-stone-200 rounded-lg p-3 text-sm bg-white font-mono leading-relaxed" style="height: 45vh;" spellcheck="false"></textarea>
            <div id="doc-preview-wrap" class="hidden mt-3 border border-stone-200 rounded-lg p-4 bg-white">
                <p class="text-[11px] text-stone-400 mb-2">미리보기</p>
                <div id="doc-preview" class="md-body"></div>
            </div>
            <div id="doc-editor-status" class="text-xs text-rose-500 my-2 h-4"></div>
            <!-- 저장/취소는 화면 하단에 고정되어 긴 레시피에서도 스크롤 없이 누를 수 있습니다 -->
            <div class="doc-editor-bar">
                <button type="button" id="doc-editor-delete" onclick="deleteDoc()" class="hidden px-3 py-2.5 rounded-lg bg-rose-50 text-rose-600 text-sm font-medium"><i class="fa-solid fa-trash"></i></button>
                <button type="button" onclick="showDocList()" class="flex-1 py-2.5 rounded-lg bg-stone-100 text-stone-600 text-sm font-medium">취소</button>
                <button type="button" onclick="saveDoc()" class="flex-1 py-2.5 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-sm font-medium">저장</button>
            </div>
        </div>
    </main>

    <script>function currentDocId(){ return window.__currentDocId; }</script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="assets/firebase-config.js"></script>
    <script src="assets/auth.js"></script>
    <script src="assets/ratings.js"></script>
    <script src="assets/comments.js"></script>
    <script src="assets/docs.js"></script>
</body>
</html>
