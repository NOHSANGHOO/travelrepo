<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>여행 상세</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        window.tailwind = window.tailwind || {};
        tailwind.config = { theme: { extend: { colors: { teal: {
            50: '#f2f7f4', 100: '#dfeae3', 200: '#c2d8ca', 300: '#98bda8', 400: '#6ba088',
            500: '#4d8a70', 600: '#3f735d', 700: '#355d4b', 800: '#2d4b3d', 900: '#273e33'
        } } } } };
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f6f1e9; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .tab-content { display: none; animation: fadeIn 0.35s cubic-bezier(0.22,1,0.36,1); }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .timeline-line::before { content: ''; position: absolute; left: 20px; top: 24px; bottom: -24px; width: 2px; background-color: #e5ded4; z-index: 0; }
        .timeline-item:last-child .timeline-line::before { display: none; }
        .map-btn { display: inline-flex; align-items: center; font-size: 0.7rem; color: #3f735d; background-color: #dfeae3; padding: 2px 6px; border-radius: 6px; margin-left: 6px; text-decoration: none; transition: background-color 0.2s, transform 0.08s; }
        .map-btn:hover { background-color: #c2d8ca; }
        .map-btn:active { transform: scale(0.94); }
        .map-btn i { margin-right: 3px; }
        .info-card { background: white; border-radius: 1rem; padding: 1.25rem; margin-bottom: 1rem; box-shadow: 0 1px 3px 0 rgba(80, 60, 40, 0.06); border: 1px solid #efe9df; }
        .info-card-header { font-weight: 700; color: #292524; margin-bottom: 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px solid #efe9df; display: flex; align-items: center; }
        .info-card-header i { margin-right: 0.5rem; font-size: 1.1rem; }
        .data-row { display: flex; margin-bottom: 0.5rem; font-size: 0.875rem; }
        .data-label { width: 80px; color: #78716c; font-weight: 500; flex-shrink: 0; }
        .data-value { color: #44403c; flex-grow: 1; }
        /* micro-interactions */
        button:not(:disabled) { transition: transform 0.1s ease, background-color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease; }
        button:not(:disabled):active { transform: scale(0.95); }
        .item-card { transition: box-shadow 0.2s ease, transform 0.14s cubic-bezier(0.22,1,0.36,1); }
        .drag-handle { cursor: grab; touch-action: none; }
        .timeline-item.dragging { z-index: 40; }
        .timeline-item.dragging .item-card { transform: scale(1.035) rotate(-0.4deg); box-shadow: 0 14px 30px rgba(80,60,40,0.18); }
        body.dragging-active, body.dragging-active * { cursor: grabbing !important; }
        .tab-btn { position: relative; }
        .note-btn, .map-btn, a { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="pb-20">
    <script>document.body.dataset.tripId = new URLSearchParams(location.search).get('id') || '';</script>

    <div id="access-gate" style="display:none;" class="fixed inset-0 z-[100] bg-stone-900 flex items-center justify-center p-6">
        <div class="bg-white rounded-2xl p-6 max-w-xs w-full text-center shadow-xl">
            <i class="fa-solid fa-lock text-3xl text-stone-400 mb-3"></i>
            <h2 class="font-bold text-stone-800 mb-1">로그인이 필요합니다</h2>
            <p class="text-xs text-stone-500 mb-4">여행 계획을 보려면 구글 계정으로 로그인하세요</p>
            <button type="button" onclick="gateSignIn()" class="w-full py-2.5 rounded-lg border border-stone-200 text-stone-700 text-sm font-medium flex items-center justify-center gap-2">
                <i class="fa-brands fa-google text-rose-500"></i> Google 계정으로 로그인
            </button>
            <p id="access-gate-error" class="text-xs text-rose-500 mt-2 h-4"></p>
        </div>
    </div>

    <div id="trip-lock" class="fixed inset-0 z-[90] bg-stone-900 flex items-center justify-center p-6" style="display:none;">
        <div class="bg-white rounded-2xl p-6 max-w-xs w-full text-center shadow-xl">
            <i class="fa-solid fa-hourglass-half text-3xl text-stone-400 mb-3"></i>
            <h2 class="font-bold text-stone-800 mb-1">아직 공개 전인 여행이에요</h2>
            <p class="text-xs text-stone-500">여행이 끝나면 누구나 볼 수 있어요.<br>지금은 관리자만 확인할 수 있습니다.</p>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-stone-900 text-white p-5 sticky top-0 z-50 shadow-md">
        <div class="flex justify-between items-center mb-2">
            <a href="trips.html" class="text-stone-300 hover:text-white text-xs inline-flex items-center gap-1"><i class="fa-solid fa-arrow-left"></i> 여행 목록으로</a>
            <div class="flex items-center gap-2">
                <button type="button" onclick="copyShareLink(location.href, event)" class="text-stone-300 hover:text-white w-8 h-8 rounded-full flex items-center justify-center hover:bg-white/10" title="여행 공유 링크 복사"><i class="fa-solid fa-share-nodes"></i></button>
                <button type="button" onclick="openTripSettings()" class="admin-only hidden text-stone-300 hover:text-white w-8 h-8 rounded-full flex items-center justify-center hover:bg-white/10" title="여행 정보 편집"><i class="fa-solid fa-gear"></i></button>
                <div class="relative">
                    <button id="profile-btn" type="button" onclick="onProfileClick(event)" class="text-stone-300 hover:text-white w-8 h-8 rounded-full flex items-center justify-center hover:bg-white/10" title="로그인"><i id="admin-login-icon" class="fa-solid fa-arrow-right-to-bracket"></i></button>
                    <div id="profile-popover" class="hidden absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-xl border border-stone-100 p-3 text-left z-[80]">
                        <p class="text-[11px] text-stone-400 mb-0.5">로그인 계정</p>
                        <p id="profile-email" class="text-sm font-medium text-stone-800 break-all"></p>
                        <p id="profile-role" class="text-xs text-teal-600 font-medium mb-3"></p>
                        <button type="button" onclick="doSignOut()" class="w-full py-2 rounded-lg bg-stone-100 hover:bg-stone-200 text-stone-600 text-sm font-medium">로그아웃</button>
                    </div>
                </div>
            </div>
        </div>
        <div id="trip-header-body"></div>
    </header>

    <!-- Navigation Tabs (built dynamically) -->
    <nav class="bg-white shadow-sm sticky top-[132px] z-40">
        <div id="trip-tabs" class="flex overflow-x-auto hide-scrollbar text-sm font-medium text-stone-500 whitespace-nowrap px-2"></div>
    </nav>

    <!-- CSV Toolbar -->
    <div class="max-w-lg mx-auto px-4 pt-3 flex flex-wrap gap-2">
        <button type="button" onclick="exportTripCsv()" class="text-xs font-medium text-stone-600 bg-white border border-stone-200 rounded-full px-3 py-1.5 inline-flex items-center gap-1 transition active:scale-95 hover:border-stone-300"><i class="fa-solid fa-file-export"></i> CSV 내보내기</button>
        <button type="button" onclick="downloadCsvTemplate()" class="text-xs font-medium text-stone-600 bg-white border border-stone-200 rounded-full px-3 py-1.5 inline-flex items-center gap-1 transition active:scale-95 hover:border-stone-300"><i class="fa-solid fa-file-lines"></i> 양식 받기</button>
        <label class="admin-only hidden text-xs font-medium text-teal-700 bg-teal-50 border border-teal-200 rounded-full px-3 py-1.5 inline-flex items-center gap-1 cursor-pointer transition active:scale-95 hover:bg-teal-100"><i class="fa-solid fa-file-import"></i> CSV 가져오기<input type="file" accept=".csv,text/csv" onchange="importTripCsv(event)" class="hidden"></label>
    </div>

    <!-- Main Content Area -->
    <main class="p-4 max-w-lg mx-auto">
        <div id="trip-days"></div>

        <!-- Info tab (Firestore-backed, editable) -->
        <div id="info" class="tab-content">
            <h2 class="text-lg font-bold text-stone-800 mb-4 ml-1">여행 상세 정보</h2>
            <div id="info-sections"></div>
            <button type="button" id="info-add-btn" class="hidden w-full py-2.5 rounded-lg border border-dashed border-stone-300 text-stone-500 text-sm font-medium mt-1" onclick="openAddInfoSection()">
                <i class="fa-solid fa-plus mr-1"></i> 정보 카드 추가
            </button>
        </div>
    </main>

    <!-- Comments (visible on all tabs) -->
    <section id="comments-root" class="max-w-lg mx-auto px-4 pb-10 pt-1"></section>

    <!-- Note Modal -->
    <div id="note-modal" class="fixed inset-0 z-[60] hidden">
        <div class="absolute inset-0 bg-black/40" onclick="closeNoteModal()"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl p-4 max-w-lg mx-auto">
            <h3 id="note-modal-title" class="font-bold text-stone-800 mb-2">메모</h3>
            <textarea id="note-modal-textarea" class="w-full border border-stone-200 rounded-lg p-2 text-sm h-28 focus:outline-none focus:ring-2 focus:ring-amber-300" placeholder="메모를 입력하세요 (URL 링크도 남길 수 있어요)"></textarea>
            <div id="note-modal-status" class="text-xs text-stone-400 mt-1 h-4"></div>
            <div class="flex gap-2 mt-3 pb-2">
                <button type="button" onclick="closeNoteModal()" class="flex-1 py-2 rounded-lg bg-stone-100 text-stone-600 text-sm font-medium">닫기</button>
                <button type="button" id="note-modal-save" onclick="saveNote()" class="flex-1 py-2 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-sm font-medium">저장</button>
            </div>
        </div>
    </div>

    <!-- Route (하루 동선) Modal -->
    <div id="route-modal" class="fixed inset-0 z-[66] hidden">
        <div class="absolute inset-0 bg-black/40" onclick="closeRouteModal()"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl p-4 max-w-lg mx-auto max-h-[80vh] overflow-y-auto">
            <h3 class="font-bold text-stone-800 mb-1"><i class="fa-solid fa-route text-teal-600 mr-1"></i> 하루 동선</h3>
            <p class="text-xs text-stone-500 mb-3">번호 순서대로 방문해요. 장소를 누르면 지도가 하나씩 열립니다.</p>
            <ol id="route-list" class="space-y-2 mb-3"></ol>
            <p id="route-hint" class="text-xs text-stone-400 mb-2"></p>
            <button type="button" id="route-drive-btn" onclick="openRouteDriving()" class="w-full py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-sm font-semibold flex items-center justify-center gap-2 transition active:scale-95">
                <i class="fa-solid fa-person-walking"></i> 구글지도에서 도보 경로 보기
            </button>
            <button type="button" onclick="closeRouteModal()" class="w-full mt-2 py-2 rounded-lg bg-stone-100 text-stone-600 text-sm font-medium">닫기</button>
        </div>
    </div>

    <!-- Item Add/Edit Modal -->
    <div id="item-modal" class="fixed inset-0 z-[65] hidden">
        <div class="absolute inset-0 bg-black/40" onclick="closeItemModal()"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl p-4 max-w-lg mx-auto max-h-[85vh] overflow-y-auto">
            <h3 id="item-modal-title" class="font-bold text-stone-800 mb-3">일정카드 추가</h3>
            <label class="text-xs text-stone-500 font-medium">종류</label>
            <select id="item-modal-preset" class="w-full border border-stone-200 rounded-lg p-2 text-sm mb-2"></select>
            <label class="text-xs text-stone-500 font-medium">시간</label>
            <input id="item-modal-time" type="text" placeholder="예: 09:00 ~ 10:30" class="w-full border border-stone-200 rounded-lg p-2 text-sm mb-2">
            <label class="text-xs text-stone-500 font-medium">제목</label>
            <input id="item-modal-title-input" type="text" placeholder="일정 제목" class="w-full border border-stone-200 rounded-lg p-2 text-sm mb-2">
            <label class="text-xs text-stone-500 font-medium">설명 (선택)</label>
            <textarea id="item-modal-desc" class="w-full border border-stone-200 rounded-lg p-2 text-sm h-20 mb-2" placeholder="세부 설명, URL 링크도 가능"></textarea>
            <label class="text-xs text-stone-500 font-medium">장소 링크 (선택)</label>
            <input id="item-modal-map" type="text" placeholder="장소명 입력 → 구글지도 검색 / URL 붙여넣기 → 그 링크로 연결" class="w-full border border-stone-200 rounded-lg p-2 text-sm mb-2">
            <div id="item-modal-status" class="text-xs text-rose-500 mb-2 h-4"></div>
            <div class="flex gap-2 pb-2">
                <button type="button" id="item-modal-delete" onclick="deleteItemFromModal()" class="hidden px-3 py-2 rounded-lg bg-rose-50 text-rose-600 text-sm font-medium"><i class="fa-solid fa-trash"></i></button>
                <button type="button" onclick="closeItemModal()" class="flex-1 py-2 rounded-lg bg-stone-100 text-stone-600 text-sm font-medium">취소</button>
                <button type="button" onclick="saveItem()" class="flex-1 py-2 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-sm font-medium">저장</button>
            </div>
        </div>
    </div>

    <!-- Info Section Add/Edit Modal -->
    <div id="info-modal" class="fixed inset-0 z-[65] hidden">
        <div class="absolute inset-0 bg-black/40" onclick="closeInfoModal()"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl p-4 max-w-lg mx-auto max-h-[85vh] overflow-y-auto">
            <h3 id="info-modal-heading" class="font-bold text-stone-800 mb-3">정보 카드 추가</h3>
            <label class="text-xs text-stone-500 font-medium">아이콘</label>
            <select id="info-modal-icon" class="w-full border border-stone-200 rounded-lg p-2 text-sm mb-2"></select>
            <label class="text-xs text-stone-500 font-medium">제목</label>
            <input id="info-modal-title-input" type="text" placeholder="카드 제목 (예: 항공편 정보)" class="w-full border border-stone-200 rounded-lg p-2 text-sm mb-3">
            <label class="text-xs text-stone-500 font-medium">내용 (항목은 비워두면 불릿 줄로 표시됩니다)</label>
            <div id="info-modal-rows" class="mt-1"></div>
            <button type="button" onclick="addInfoRow()" class="text-xs text-teal-700 font-medium mb-2"><i class="fa-solid fa-plus mr-1"></i> 행 추가</button>
            <div id="info-modal-status" class="text-xs text-rose-500 mb-2 h-4"></div>
            <div class="flex gap-2 pb-2">
                <button type="button" id="info-modal-delete" onclick="deleteInfoSection()" class="hidden px-3 py-2 rounded-lg bg-rose-50 text-rose-600 text-sm font-medium"><i class="fa-solid fa-trash"></i></button>
                <button type="button" onclick="closeInfoModal()" class="flex-1 py-2 rounded-lg bg-stone-100 text-stone-600 text-sm font-medium">취소</button>
                <button type="button" onclick="saveInfoSection()" class="flex-1 py-2 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-sm font-medium">저장</button>
            </div>
        </div>
    </div>

    <!-- Trip Settings Modal (admin) -->
    <div id="trip-settings-modal" class="fixed inset-0 z-[70] hidden">
        <div class="absolute inset-0 bg-black/40" onclick="closeTripSettings()"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl p-4 max-w-lg mx-auto max-h-[88vh] overflow-y-auto">
            <h3 class="font-bold text-stone-800 mb-3">여행 정보 편집</h3>
            <label class="text-xs text-stone-500 font-medium">헤더 제목</label>
            <input id="ts-header" type="text" class="w-full border border-stone-200 rounded-lg p-2 text-sm mb-2">
            <label class="text-xs text-stone-500 font-medium">목록 카드 제목</label>
            <input id="ts-title" type="text" class="w-full border border-stone-200 rounded-lg p-2 text-sm mb-2">
            <label class="text-xs text-stone-500 font-medium">부제 (선택)</label>
            <input id="ts-subtitle" type="text" class="w-full border border-stone-200 rounded-lg p-2 text-sm mb-2">
            <label class="text-xs text-stone-500 font-medium">위치</label>
            <input id="ts-location" type="text" class="w-full border border-stone-200 rounded-lg p-2 text-sm mb-2">
            <div class="flex gap-2 mb-2">
                <div class="flex-1"><label class="text-xs text-stone-500 font-medium">시작일</label><input id="ts-start" type="date" class="w-full border border-stone-200 rounded-lg p-2 text-sm"></div>
                <div class="flex-1"><label class="text-xs text-stone-500 font-medium">종료일</label><input id="ts-end" type="date" class="w-full border border-stone-200 rounded-lg p-2 text-sm"></div>
            </div>
            <div class="border-t border-stone-100 mt-2 pt-2">
                <div class="flex items-center justify-between mb-1">
                    <label class="text-xs text-stone-500 font-medium">일차 (라벨 편집 / 추가 / 삭제)</label>
                    <button type="button" onclick="addSettingsDay()" class="text-xs text-teal-700 font-medium"><i class="fa-solid fa-plus mr-1"></i>일차 추가</button>
                </div>
                <div id="ts-days"></div>
            </div>
            <div id="ts-status" class="text-xs text-rose-500 mb-2 h-4 mt-2"></div>
            <div class="flex gap-2 pb-2">
                <button type="button" onclick="deleteTrip()" class="px-3 py-2 rounded-lg bg-rose-50 text-rose-600 text-sm font-medium"><i class="fa-solid fa-trash"></i></button>
                <button type="button" onclick="closeTripSettings()" class="flex-1 py-2 rounded-lg bg-stone-100 text-stone-600 text-sm font-medium">취소</button>
                <button type="button" onclick="saveTripSettings()" class="flex-1 py-2 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-sm font-medium">저장</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="assets/firebase-config.js"></script>
    <script src="assets/auth.js"></script>
    <script src="assets/comments.js"></script>
    <script src="assets/trips-data.js"></script>
    <script src="assets/trips-store.js"></script>
    <script src="assets/trip-seeds.js"></script>
    <script src="assets/trip-visibility.js"></script>
    <script src="assets/notes.js"></script>
    <script src="assets/itinerary.js"></script>
    <script src="assets/trip-io.js"></script>
    <script src="assets/tripinfo.js"></script>
    <script src="assets/trip-page.js"></script>
</body>
</html>
