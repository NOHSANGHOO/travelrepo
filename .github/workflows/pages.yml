name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 브라우저가 예전 assets/*.js 를 캐시해서 배포한 변경이 반영되지 않는 문제를
      # 막기 위해, 배포할 때마다 커밋 해시를 쿼리로 붙여 URL을 바꿔줍니다.
      - name: Cache-bust local asset URLs
        run: |
          V="${GITHUB_SHA::8}"
          for f in *.html trips/*.html; do
            [ -e "$f" ] || continue
            sed -i -E 's#(src|href)="((\.\./)?assets/[a-zA-Z0-9._-]+\.(js|css))"#\1="\2?v='"$V"'"#g' "$f"
            echo "stamped $f"
          done
          grep -o 'assets/[a-zA-Z0-9._-]*\.js?*[^"]*' index.html | head -5 || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
