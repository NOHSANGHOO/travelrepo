<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>여행계획 · Teo's space</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        window.tailwind = window.tailwind || {};
        tailwind.config = { theme: { extend: { colors: { teal: {
            50: '#f2f7f4', 100: '#dfeae3', 200: '#c2d8ca', 300: '#98bda8', 400: '#6ba088',
            500: '#4d8a70', 600: '#3f735d', 700: '#355d4b', 800: '#2d4b3d', 900: '#273e33'
        } } } } };
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f6f1e9;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        button:not(:disabled), a { transition: transform 0.1s ease, background-color 0.15s ease, box-shadow 0.15s ease; }
        button:not(:disabled):active { transform: scale(0.96); }
        #trip-list > a:active { transform: scale(0.985); }
        /* Star ratings */
        .rt-stars { position: relative; display: inline-block; line-height: 1; white-space: nowrap; }
        .rt-stars .rt-base { color: #e2ddd4; letter-spacing: 1px; }
        .rt-stars .rt-fill { position: absolute; left: 0; top: 0; overflow: hidden; color: #f0b429; letter-spacing: 1px; transition: width 0.22s cubic-bezier(0.22,1,0.36,1); }
    </style>
</head>
<body class="pb-20">

    <div id="access-gate" style="display:none;" class="fixed inset-0 z-[100] bg-stone-900 flex items-center justify-center p-6">
        <div class="bg-white rounded-2xl p-6 max-w-xs w-full text-center shadow-xl">
            <i class="fa-solid fa-lock text-3xl text-stone-400 mb-3"></i>
            <h2 class="font-bold text-stone-800 mb-1">로그인이 필요합니다</h2>
            <p class="text-xs text-stone-500 mb-4">여행 계획을 보려면 구글 계정으로 로그인하세요</p>
            <button type="button" onclick="gateSignIn()" class="w-full py-2.5 rounded-lg border border-stone-200 text-stone-700 text-sm font-medium flex items-center justify-center gap-2">
                <i class="fa-brands fa-google text-rose-500"></i> Google 계정으로 로그인
            </button>
            <p id="access-gate-error" class="text-xs text-rose-500 mt-2 h-4"></p>
        </div>
    </div>

    <header class="bg-stone-900 text-white p-5 sticky top-0 z-50 shadow-md">
        <a href="index.html" class="text-stone-300 hover:text-white text-xs inline-flex items-center gap-1 mb-2"><i class="fa-solid fa-arrow-left"></i> Teo's space</a>
        <div class="flex justify-between items-center mb-1">
            <h1 class="text-xl font-bold">여행계획 ✈️</h1>
            <div class="relative">
                <button id="profile-btn" type="button" onclick="onProfileClick(event)" class="text-stone-300 hover:text-white w-8 h-8 rounded-full flex items-center justify-center hover:bg-white/10" title="로그인">
                    <i id="admin-login-icon" class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
                <div id="profile-popover" class="hidden absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-xl border border-stone-100 p-3 text-left z-[80]">
                    <p class="text-[11px] text-stone-400 mb-0.5">로그인 계정</p>
                    <p id="profile-email" class="text-sm font-medium text-stone-800 break-all"></p>
                    <p id="profile-role" class="text-xs text-teal-600 font-medium mb-3"></p>
                    <button type="button" onclick="doSignOut()" class="w-full py-2 rounded-lg bg-stone-100 hover:bg-stone-200 text-stone-600 text-sm font-medium">로그아웃</button>
                </div>
            </div>
        </div>
        <p class="text-sm text-stone-300 mt-1">다녀온, 그리고 앞으로 떠날 여행들</p>
    </header>

    <nav class="bg-white shadow-sm sticky top-[84px] z-40">
        <div class="flex gap-2 overflow-x-auto hide-scrollbar px-4 py-3 max-w-lg mx-auto">
            <button data-filter="all" onclick="switchFilter('all')" class="filter-btn bg-teal-600 text-white text-sm font-medium px-3 py-1.5 rounded-full transition-colors">전체</button>
            <button data-filter="upcoming" onclick="switchFilter('upcoming')" class="filter-btn bg-white text-stone-600 text-sm font-medium px-3 py-1.5 rounded-full border border-stone-200 transition-colors">예정</button>
            <button data-filter="ongoing" onclick="switchFilter('ongoing')" class="filter-btn bg-white text-stone-600 text-sm font-medium px-3 py-1.5 rounded-full border border-stone-200 transition-colors">진행중</button>
            <button data-filter="past" onclick="switchFilter('past')" class="filter-btn bg-white text-stone-600 text-sm font-medium px-3 py-1.5 rounded-full border border-stone-200 transition-colors">완료</button>
        </div>
    </nav>

    <main class="p-4 max-w-lg mx-auto">
        <button type="button" id="new-trip-btn" onclick="openNewTrip()" class="hidden w-full mb-4 py-3 rounded-2xl border border-dashed border-teal-300 text-teal-700 text-sm font-semibold flex items-center justify-center gap-2 transition active:scale-95 hover:bg-teal-50">
            <i class="fa-solid fa-plus"></i> 새 여행 만들기
        </button>
        <div id="trip-list" class="space-y-4"></div>
        <div id="empty-state" class="hidden text-center text-stone-400 text-sm py-16">
            <i class="fa-solid fa-suitcase-rolling text-3xl mb-3"></i>
            <p>해당하는 여행이 없어요.</p>
        </div>
    </main>

    <!-- New Trip Modal -->
    <div id="new-trip-modal" class="fixed inset-0 z-[70] hidden">
        <div class="absolute inset-0 bg-black/40" onclick="closeNewTrip()"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl p-4 max-w-lg mx-auto">
            <h3 class="font-bold text-stone-800 mb-3">새 여행 만들기</h3>
            <label class="text-xs text-stone-500 font-medium">여행 이름</label>
            <input id="nt-title" type="text" placeholder="예: 제주 가족여행" class="w-full border border-stone-200 rounded-lg p-2 text-sm mb-2">
            <label class="text-xs text-stone-500 font-medium">위치 (선택)</label>
            <input id="nt-location" type="text" placeholder="예: 대한민국 제주" class="w-full border border-stone-200 rounded-lg p-2 text-sm mb-2">
            <div class="flex gap-2 mb-2">
                <div class="flex-1">
                    <label class="text-xs text-stone-500 font-medium">시작일</label>
                    <input id="nt-start" type="date" class="w-full border border-stone-200 rounded-lg p-2 text-sm">
                </div>
                <div class="flex-1">
                    <label class="text-xs text-stone-500 font-medium">종료일</label>
                    <input id="nt-end" type="date" class="w-full border border-stone-200 rounded-lg p-2 text-sm">
                </div>
            </div>
            <p class="text-xs text-stone-400 mb-2">일차는 날짜에 맞춰 자동 생성되며, 이후 여행 페이지에서 일정/정보를 추가하면 됩니다.</p>
            <div id="nt-status" class="text-xs text-rose-500 mb-2 h-4"></div>
            <div class="flex gap-2 pb-2">
                <button type="button" onclick="closeNewTrip()" class="flex-1 py-2 rounded-lg bg-stone-100 text-stone-600 text-sm font-medium">취소</button>
                <button type="button" onclick="createTrip()" class="flex-1 py-2 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-sm font-medium">만들기</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="assets/firebase-config.js"></script>
    <script src="assets/auth.js"></script>
    <script src="assets/ratings.js"></script>
    <script src="assets/trips-data.js"></script>
    <script src="assets/trips-store.js"></script>
    <script src="assets/site.js"></script>
</body>
</html>
